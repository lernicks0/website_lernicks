# Lernicks 全站 Nginx 配置
# Cloudflare 使用 Flexible 模式，所以源站只监听 80 端口。

server {
    listen 80;
    server_name lernicks.cn www.lernicks.cn;

    location / {
        proxy_pass http://127.0.0.1:1149;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Cloudflare origin networks (https://www.cloudflare.com/ips/) for note.lernicks.cn.
geo $realip_remote_addr $note_from_cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    listen 80;
    server_name note.lernicks.cn;

    if ($note_from_cloudflare = 0) { return 403; }
    if ($http_x_forwarded_proto != https) { return 308 https://note.lernicks.cn$request_uri; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name tbl.lernicks.cn;
    client_max_body_size 11m;

    location / {
        proxy_pass http://127.0.0.1:1148;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

