<!DOCTYPE html>
<html lang="zh-CN" data-astra-site="note">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" id="themeColor" content="#12203a" />
<link rel="icon" type="image/png" href="/favicon.png" />
<title>便签电报 · Notes</title>
<script>
  // 在页面画出来之前先读取主题，避免打开时闪一下旧颜色。
  try{
    var firstTheme = localStorage.getItem('tg_note_theme_v1') === 'tech' ? 'tech' : 'classic';
    document.documentElement.setAttribute('data-note-theme', firstTheme);
    document.getElementById('themeColor').content = firstTheme === 'tech' ? '#050b14' : '#12203a';
  }catch(_){ document.documentElement.setAttribute('data-note-theme', 'classic'); }
</script>
<style>
  :root{
    --ink: #12203a;
    --paper: #f4ecd8;
    --text-dark: #241d12;
    --text-light: #eee6d3;
    --muted: #7c8aa3;
    --teal: #3f7d76;
    --teal-dark: #2c5b56;
    --seal: #a13d33;
    --seal-dark: #7e2e26;
    --font-display: 'Courier New', 'Consolas', monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'Consolas', 'Courier New', monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: var(--ink);
    color: var(--text-light);
    font-family: var(--font-body);
  }
  #app{min-height:100vh; display:flex; flex-direction:column; align-items:center;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;}
  input, textarea{font-family:inherit;}

  .topnav{width:100%; display:flex; justify-content:space-between; align-items:center; padding:22px 32px; letter-spacing:0.08em; font-size:13px; text-transform:uppercase; color:var(--muted);}
  .topnav .brand{font-family:var(--font-display); color:var(--text-light); font-size:14px; letter-spacing:0.12em;}
  .topnav .brand b{color:#e7b98f;}
  .topnav nav{display:flex;align-items:center;justify-content:flex-end;}
  .topnav nav a{margin-left:22px; transition:color .15s;}
  .topnav nav a:hover{color:var(--text-light);}
  .theme-toggle{margin-left:18px;padding:7px 10px;border:1px solid rgba(255,255,255,.13);border-radius:18px;color:var(--text-light);background:rgba(255,255,255,.06);font-size:12px;letter-spacing:.04em;white-space:nowrap;transition:.18s;}
  .theme-toggle:hover{background:rgba(255,255,255,.13);transform:translateY(-1px);}
  .theme-to-classic{display:none;}

  .home-wrap{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px 100px;}
  .telegram-title{font-family:var(--font-display); font-size:clamp(28px,5vw,46px); text-align:center; margin:0 0 6px; color:var(--text-light);}
  .telegram-sub{color:var(--muted); font-size:14px; text-align:center; max-width:440px; line-height:1.7; margin-bottom:40px;}
  .telegram-card{background:var(--paper); color:var(--text-dark); width:min(460px,92vw); padding:34px 30px 28px; position:relative; box-shadow:0 30px 60px -20px rgba(0,0,0,0.55); border-radius:2px;}
  .perforation{position:absolute; top:0; left:0; right:0; height:14px; background-image:radial-gradient(circle 7px, var(--ink) 7px, transparent 7.5px); background-size:28px 28px; background-position:14px -7px; background-repeat:repeat-x;}
  .telegram-card label{display:block; font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#6b6250; margin-bottom:8px; margin-top:18px;}
  .slug-input{width:100%; border:none; border-bottom:2px solid #c9bd9c; background:transparent; font-size:20px; font-family:var(--font-mono); padding:6px 2px; color:var(--text-dark); outline:none;}
  .slug-input:focus{border-color:var(--teal);}
  .go-btn{margin-top:26px; width:100%; background:var(--ink); color:var(--text-light); padding:14px; font-size:14px; letter-spacing:0.14em; text-transform:uppercase; font-family:var(--font-mono); border-radius:1px; transition:transform .12s, background .15s;}
  .go-btn:hover{background:var(--teal-dark); transform:translateY(-1px);}
  .home-hint{margin-top:22px; color:var(--muted); font-size:12.5px; text-align:center; max-width:400px; line-height:1.6;}

  .note-wrap{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; padding:0 0 60px;}
  .note-bar{width:min(880px,94vw); display:flex; align-items:center; justify-content:space-between; padding:18px 4px 14px; flex-wrap:wrap; gap:10px;}
  .postmark{font-family:var(--font-mono); font-size:13px; color:var(--text-light); border:1px dashed var(--muted); padding:6px 12px; border-radius:20px; display:flex; align-items:center; gap:8px;}
  .postmark .dot{width:6px;height:6px;border-radius:50%;background:var(--teal);}
  .note-actions{display:flex; gap:10px; align-items:center;}
  .icon-btn{background:rgba(255,255,255,0.06); color:var(--text-light); padding:9px 14px; border-radius:20px; font-size:12.5px; display:flex; align-items:center; gap:6px; transition:background .15s;}
  .icon-btn:hover{background:rgba(255,255,255,0.14);}
  .icon-btn.seal{background:var(--seal);}
  .icon-btn.seal:hover{background:var(--seal-dark);}
  .icon-btn.seal.off{background:rgba(255,255,255,0.06);}
  .icon-btn.seal.off:hover{background:rgba(255,255,255,0.14);}

  .paper-page{width:min(880px,94vw); background:var(--paper); position:relative; min-height:60vh; box-shadow:0 30px 60px -20px rgba(0,0,0,0.55); border-radius:2px;}
  .paper-page textarea{width:100%; min-height:60vh; border:none; outline:none; background:transparent; resize:vertical; padding:40px 44px 30px; font-size:17px; line-height:1.85; color:var(--text-dark); font-family:var(--font-body);}
  .save-status{position:absolute; bottom:12px; right:20px; font-family:var(--font-mono); font-size:11px; color:#8a806a;}

  .settings-panel{width:min(880px,94vw); background:rgba(255,255,255,0.05); border-radius:4px; margin-top:14px; padding:20px 22px; font-size:13.5px; color:var(--text-light); display:none;}
  .settings-panel.open{display:block;}
  .settings-panel .row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .settings-panel input[type=text]{background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.15); color:var(--text-light); padding:9px 12px; border-radius:4px; font-size:13.5px; outline:none; flex:1;}
  .settings-panel button.apply{background:var(--teal); color:#fff; padding:9px 16px; border-radius:4px; font-size:13px;}
  .settings-panel button.apply:hover{background:var(--teal-dark);}
  .settings-note{color:var(--muted); font-size:12px; line-height:1.6; margin-top:6px;}

  .gate-wrap{flex:1; width:100%; display:flex; align-items:center; justify-content:center; padding:40px 20px;}
  .gate-card{background:var(--paper); color:var(--text-dark); width:min(400px,90vw); padding:36px 30px; text-align:center; border-radius:2px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.55); position:relative;}
  .wax-seal{width:60px; height:60px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #c25445, var(--seal-dark)); margin:-66px auto 20px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px rgba(0,0,0,0.4); font-size:22px;}
  .gate-card h3{font-family:var(--font-display); margin:0 0 6px; font-size:20px;}
  .gate-card p{color:#6b6250; font-size:13px; margin-bottom:20px;}
  .gate-card input{width:100%; border:none; border-bottom:2px solid #c9bd9c; background:transparent; padding:8px 2px; font-size:16px; text-align:center; outline:none; margin-bottom:18px;}
  .gate-card input:focus{border-color:var(--teal);}
  .gate-error{color:var(--seal); font-size:12.5px; margin-top:-10px; margin-bottom:14px; display:none;}

  .fb-wrap{flex:1; width:100%; display:flex; flex-direction:column; align-items:center; padding:20px 20px 80px;}
  .fb-card{background:var(--paper); color:var(--text-dark); width:min(560px,94vw); padding:32px 30px; border-radius:2px; box-shadow:0 30px 60px -20px rgba(0,0,0,0.55); position:relative;}
  .fb-card h2{font-family:var(--font-display); margin:8px 0 4px; font-size:22px;}
  .fb-card p.desc{color:#6b6250; font-size:13px; margin-bottom:22px; line-height:1.6;}
  .fb-card label{display:block; font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:#6b6250; margin-bottom:6px; margin-top:16px;}
  .fb-card input[type=text]{width:100%; border:none; border-bottom:2px solid #c9bd9c; background:transparent; padding:6px 2px; font-size:15px; outline:none;}
  .fb-card textarea{width:100%; border:1px solid #c9bd9c; background:rgba(255,255,255,0.4); padding:10px; font-size:14.5px; line-height:1.6; min-height:110px; outline:none; border-radius:2px; resize:vertical;}
  .fb-submit{margin-top:20px;}
  .fb-msg{font-size:12.5px; color:var(--teal-dark); margin-top:10px; display:none;}
  .fb-list-wrap{width:min(560px,94vw); margin-top:32px;}
  .fb-list-title{font-family:var(--font-mono); color:var(--muted); font-size:12px; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:14px;}
  .fb-item{background:rgba(255,255,255,0.05); border-radius:4px; padding:14px 16px; margin-bottom:10px; font-size:13.5px; color:var(--text-light);}
  .fb-item .meta{font-family:var(--font-mono); font-size:11px; color:var(--muted); margin-bottom:6px; display:flex; justify-content:space-between;}
  .fb-item .body{line-height:1.6; white-space:pre-wrap; word-break:break-word;}
  .fb-empty{color:var(--muted); font-size:13px; text-align:center; padding:20px 0;}

  /* 科技夜航：只改变外观，所有笔记功能仍然使用同一套代码。 */
  html[data-note-theme="tech"]{
    --ink:#050b14;
    --paper:#0d1c2e;
    --text-dark:#edfaff;
    --text-light:#f1fbff;
    --muted:#8ea8b9;
    --teal:#59e2ff;
    --teal-dark:#2bb2cf;
    --seal:#ff7188;
    --seal-dark:#cb4961;
  }
  html[data-note-theme="tech"] body{
    background:
      radial-gradient(circle at 14% 0%,rgba(31,131,185,.24),transparent 34%),
      radial-gradient(circle at 88% 18%,rgba(92,76,210,.18),transparent 32%),
      var(--ink);
  }
  html[data-note-theme="tech"] body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.38;
    background-image:linear-gradient(rgba(89,226,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(89,226,255,.026) 1px,transparent 1px);
    background-size:34px 34px;mask-image:linear-gradient(#000,transparent 88%);
  }
  html[data-note-theme="tech"] #app{position:relative;z-index:1;}
  html[data-note-theme="tech"] .topnav{border-bottom:1px solid rgba(89,226,255,.1);background:rgba(5,14,25,.52);backdrop-filter:blur(14px);}
  html[data-note-theme="tech"] .topnav .brand b{color:var(--teal);text-shadow:0 0 22px rgba(89,226,255,.24);}
  html[data-note-theme="tech"] .theme-to-tech{display:none;}
  html[data-note-theme="tech"] .theme-to-classic{display:inline;}
  html[data-note-theme="tech"] .theme-toggle{border-color:rgba(89,226,255,.25);color:var(--teal);background:rgba(89,226,255,.07);}
  html[data-note-theme="tech"] .telegram-title{letter-spacing:-.035em;text-shadow:0 0 36px rgba(89,226,255,.12);}
  html[data-note-theme="tech"] .telegram-card,
  html[data-note-theme="tech"] .paper-page,
  html[data-note-theme="tech"] .gate-card,
  html[data-note-theme="tech"] .fb-card{
    border:1px solid rgba(89,226,255,.2);border-radius:20px;
    background:linear-gradient(150deg,#10243a,#091525 78%);
    box-shadow:0 28px 80px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.025);
  }
  html[data-note-theme="tech"] .perforation{left:24px;right:24px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--teal),transparent);opacity:.65;}
  html[data-note-theme="tech"] .telegram-card label,
  html[data-note-theme="tech"] .fb-card label,
  html[data-note-theme="tech"] .gate-card p,
  html[data-note-theme="tech"] .fb-card p.desc{color:var(--muted);}
  html[data-note-theme="tech"] .slug-input,
  html[data-note-theme="tech"] .gate-card input,
  html[data-note-theme="tech"] .fb-card input[type=text]{color:var(--text-dark);border-color:rgba(89,226,255,.24);}
  html[data-note-theme="tech"] .slug-input::placeholder,
  html[data-note-theme="tech"] .gate-card input::placeholder,
  html[data-note-theme="tech"] .fb-card input::placeholder,
  html[data-note-theme="tech"] .fb-card textarea::placeholder{color:#5f788a;}
  html[data-note-theme="tech"] .go-btn{border-radius:10px;color:#04151d;background:linear-gradient(135deg,var(--teal),#79efb9);font-weight:900;box-shadow:0 10px 30px rgba(89,226,255,.13);}
  html[data-note-theme="tech"] .go-btn:hover{background:linear-gradient(135deg,#86ecff,#9bf5ca);}
  html[data-note-theme="tech"] #randomBtn{border-radius:9px!important;color:#04151d!important;font-weight:800;background:var(--teal)!important;}
  html[data-note-theme="tech"] .postmark{border-style:solid;border-color:rgba(89,226,255,.24);color:var(--text-light);background:rgba(12,31,51,.65);}
  html[data-note-theme="tech"] .icon-btn{border:1px solid rgba(89,226,255,.13);background:rgba(16,42,66,.64);}
  html[data-note-theme="tech"] .icon-btn:hover{border-color:rgba(89,226,255,.36);background:rgba(24,57,86,.8);}
  html[data-note-theme="tech"] .icon-btn.seal{border-color:rgba(255,113,136,.35);background:rgba(143,42,62,.5);}
  html[data-note-theme="tech"] .paper-page textarea{color:var(--text-dark);background-image:linear-gradient(rgba(89,226,255,.035) 1px,transparent 1px);background-size:100% 31.45px;}
  html[data-note-theme="tech"] .save-status{color:#7192a7;}
  html[data-note-theme="tech"] .settings-panel{border:1px solid rgba(89,226,255,.14);border-radius:13px;background:rgba(10,27,45,.78);backdrop-filter:blur(14px);}
  html[data-note-theme="tech"] .settings-panel input[type=text]{border-color:rgba(89,226,255,.2);border-radius:9px;background:#071625;}
  html[data-note-theme="tech"] .settings-panel button.apply{border-radius:9px;color:#04151d;font-weight:800;}
  html[data-note-theme="tech"] .wax-seal{border-radius:18px;color:#06151d;background:linear-gradient(145deg,var(--teal),#7a98ff);box-shadow:0 10px 30px rgba(89,226,255,.2);}
  html[data-note-theme="tech"] .fb-card textarea{color:var(--text-dark);border-color:rgba(89,226,255,.2);border-radius:10px;background:#071625;}
  html[data-note-theme="tech"] .fb-item{border:1px solid rgba(89,226,255,.12);border-radius:12px;background:rgba(13,35,56,.7);}

  @media (max-width:600px){
    .topnav{padding:18px 18px;}
    .topnav{flex-wrap:wrap;gap:11px;}
    .topnav nav{width:100%;}
    .topnav nav a{margin-left:14px;}
    .theme-toggle{margin-left:12px;}
    .paper-page textarea{padding:28px 20px 24px; font-size:16px;}
  }
</style>
<!-- ASTRA HEAD START -->
<style id="astra-style">
/* 只有 html.astra 下的样式生效；原有样式完整保留。 */
.astra-only{display:none!important}
html:not(.astra) .astra-only{display:none!important}
html.astra .astra-only{display:revert!important}
html.astra .legacy-only{display:none!important}
.design-switch{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto;font:13px/1.4 system-ui,"Microsoft YaHei",sans-serif;letter-spacing:0;text-transform:none;color:#c9d4e5}
.design-switch select{width:auto;min-width:80px;min-height:36px;padding:6px 24px 6px 10px;border:1px solid #40516a;border-radius:7px;color:#edf2fa;background:#142139;font:inherit;cursor:pointer}
.design-switch select:focus-visible{outline:3px solid #f3b15f;outline-offset:3px}
.astra-header-actions{display:flex;align-items:center;justify-content:flex-end;gap:14px;flex-wrap:wrap}
html[data-astra-site="note"] .theme-toggle{display:none}
html.astra{
  color-scheme:light;--bg:#f6f7f9;--panel:#fff;--panel2:#f0f3f8;--line:#dce1e8;--text:#1a2331;--muted:#626d7d;
  --cyan:#245de2;--blue:#245de2;--green:#217350;--gold:#986019;--purple:#6451ab;--red:#b73849;--article:#273243;
  --note:#245de2;--image:#245de2;--document:#245de2;--status:#217350;
  --a-paper:#fff;--a-soft:#eef2f8;--a-ink:#172337;--a-accent:#245de2;--a-on-accent:#fff;--a-line:#dce1e8;
}
html.astra body{background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.65;letter-spacing:0}
html.astra body:before,html.astra body:after{display:none}
html.astra *,html.astra *:before,html.astra *:after{box-sizing:border-box;text-shadow:none}
html.astra :is(button,a,input,select,textarea){-webkit-tap-highlight-color:transparent}
html.astra :is(button,a,input,select,textarea):focus-visible{outline:3px solid var(--a-accent);outline-offset:4px}
html.astra :is(input,textarea,select){font-size:16px}
html.astra :is(button,a){transition:background .16s ease,border-color .16s ease,color .16s ease,transform .16s ease}
html.astra :is(.page,.app){width:min(1180px,calc(100% - 64px));padding:26px 0 40px}
html.astra :is(.topbar,.top,header){gap:20px;flex-wrap:wrap}
html.astra :is(.topbar,.top){padding-bottom:22px;border-bottom:1px solid var(--line)}
html.astra .brand{min-width:0;gap:12px}
html.astra :is(.brand h1,.brand strong){font-size:18px;font-weight:650;letter-spacing:-.025em}
html.astra :is(.brand p,.brand span,.brand-caption){font-size:11px;letter-spacing:.1em;color:var(--muted)}
html.astra :is(.logo,.mark){width:40px;height:40px;flex:0 0 40px;border:0;border-radius:10px;background:var(--a-ink);color:#fff;box-shadow:none;font-size:18px;font-weight:700}
html.astra :is(.top-actions,.actions,.security-tools){flex-wrap:wrap}
html.astra :is(.nav-btn,.home,.home-link,.badge.action,.btn,.file-button,.preview-toggle,.copy-row button){color:var(--text);background:var(--a-paper);border:1px solid var(--line);border-radius:7px;box-shadow:none;font-size:14px;font-weight:500;padding:9px 14px;line-height:1.5;min-height:40px}
html.astra :is(.nav-btn,.home,.home-link,.badge.action,.btn,.file-button,.preview-toggle,.copy-row button):hover{background:var(--a-soft);border-color:var(--muted);transform:none}
html.astra :is(.btn.primary,.create-button,.submit-btn,.choose,.preview-toggle.active){background:var(--a-accent);border-color:var(--a-accent);color:var(--a-on-accent);box-shadow:none;border-radius:7px;font-size:14px;font-weight:600}
html.astra :is(.btn.danger,.btn-danger){color:var(--red);background:transparent;border-color:var(--red)}
html.astra .design-switch{color:var(--muted)}
html.astra .design-switch select{color:var(--text);background:var(--a-paper);border-color:var(--line);font-size:14px;min-height:40px}
html.astra :is(.online,.top-actions>.badge:not(.action)){display:none}
html.astra .hero{padding:46px 0 30px;text-align:left}
html.astra .eyebrow{color:var(--a-accent);font-size:11px;font-weight:600;letter-spacing:.18em}
html.astra .hero h2{font-size:clamp(28px,3.4vw,44px);line-height:1.3;letter-spacing:-.04em;margin:12px 0}
html.astra :is(.hero h2 span,.shine){color:var(--text);background:none;-webkit-text-fill-color:currentColor}
html.astra .hero p{color:var(--muted);margin:0;max-width:660px;font-size:15px;line-height:1.8}
html.astra :is(.panel,.feedback-panel,.editor,.key-gate){background:var(--a-paper);border:1px solid var(--line);border-radius:10px;box-shadow:none}
html.astra :is(.field,.title-input,.content-input,.admin-key-input,.copy-row input,.feedback-form input,.feedback-form textarea,.format-picker select){background:var(--a-paper);color:var(--text);border:1px solid var(--line);border-radius:6px;box-shadow:none}
html.astra :is(input,textarea)::placeholder{color:var(--muted);opacity:1}
html.astra :is(.field-label,.label,.format-picker,.feedback-form label){font-size:14px;color:var(--muted)}
html.astra :is(.tip span,.rule span,.info small,.capacity small,.counter,.copy-row label,.result-note,.history-sub){font-size:13px;line-height:1.7;color:var(--muted)}
html.astra :is(.tip strong,.rule strong,.info h3){color:var(--text)}
html.astra :is(.tip i,.rule-icon){color:var(--a-accent);background:var(--a-soft);border:0;border-radius:6px;box-shadow:none}
html.astra .meter{height:5px;background:var(--a-soft)}
html.astra .meter i{background:var(--a-accent)}
html.astra footer{color:var(--muted);font-size:12px;line-height:1.8;padding:24px 0 0;border-top:1px solid var(--line);margin-top:40px;flex-wrap:wrap}
html.astra :is(.toast,.toast.show){background:var(--a-ink);color:#fff;max-width:calc(100% - 32px);font-size:14px;border:1px solid var(--line);box-shadow:0 8px 24px #0002;border-radius:8px}
html.astra :is(.toast.bad,.toast.error){background:#7b2336;color:#fff}

<script id="astra-theme">
/* Astra 外观层。切换只更新页面属性，不重新加载、不触碰业务数据。 */
(function () {
  'use strict';
  var root = document.documentElement;
  var site = root.getAttribute('data-astra-site');
  var isNote = site === 'note';
  var storageKey = 'lernicks_design_v1';
  var meta = document.querySelector('meta[name="theme-color"]');
  var oldColor = meta ? meta.content : '#07111f';
  var choices = isNote ? [['astra', '新版'], ['classic', '经典'], ['tech', '科技']] : [['astra', '新版'], ['original', '原版']];
  function valid(value) { return choices.some(function (item) { return item[0] === value; }); }
  var selected = 'astra';
  try {
    var stored = localStorage.getItem(storageKey);
    if (valid(stored)) selected = stored;
    // 保留笔记使用者之前明确选过的经典 / 科技偏好。
    else if (isNote && !stored) {
      var previous = localStorage.getItem('tg_note_theme_v1');
      if (previous === 'classic' || previous === 'tech') selected = previous;
    }
  } catch (_) {}
  function apply(value, save) {
    if (!valid(value)) return;
    selected = value;
    root.setAttribute('data-design', value);
    root.classList.toggle('astra', value === 'astra');
    if (isNote) root.setAttribute('data-note-theme', value === 'tech' ? 'tech' : 'classic');
    if (meta) meta.content = value === 'astra' ? '#f6f7f9' : (isNote ? (value === 'tech' ? '#050b14' : '#12203a') : oldColor);
    document.querySelectorAll('[data-design-picker]').forEach(function (input) { input.value = value; });
    if (save) {
      try {
        localStorage.setItem(storageKey, value);
        if (isNote && value !== 'astra') localStorage.setItem('tg_note_theme_v1', value);
      } catch (_) {}
    }
    window.dispatchEvent(new CustomEvent('lernicks-design-change', { detail: { design: value } }));
  }
  apply(selected, false);
  function mount() {
    var target = isNote ? document.querySelector('.topnav nav') : document.querySelector('.top-actions, .security-tools, header .actions');
    if (!target) {
      var header = document.querySelector('header.topbar, .top');
      if (!header) return;
      target = document.createElement('div');
      target.className = 'astra-header-actions';
      var home = header.querySelector('.home, .home-link');
      if (home) target.appendChild(home);
      header.appendChild(target);
    }
    if (target.querySelector('[data-design-picker]')) return;
    var label = document.createElement('label');
    label.className = 'design-switch';
    var text = document.createElement('span');
    text.textContent = '外观';
    var input = document.createElement('select');
    input.setAttribute('data-design-picker', '');
    input.setAttribute('aria-label', '网站外观');
    choices.forEach(function (item) {
      var option = document.createElement('option');
      option.value = item[0]; option.textContent = item[1]; input.appendChild(option);
    });
    input.value = selected;
    label.appendChild(text); label.appendChild(input); target.appendChild(label);
  }
  document.addEventListener('change', function (event) {
    if (event.target.matches('[data-design-picker]')) apply(event.target.value, true);
  });
  window.addEventListener('storage', function (event) {
    if (event.key === storageKey && valid(event.newValue)) apply(event.newValue, false);
  });
  document.addEventListener('DOMContentLoaded', function () {
    mount();
    if (isNote) {
      var app = document.getElementById('app');
      if (app) new MutationObserver(mount).observe(app, { childList: true, subtree: true });
    }
    if (site === 'pk') {
      // 由现有成绩文字生成新版记分牌；原文字保留，原版仍可直接显示。
      function scoreboards() {
        document.querySelectorAll('.pk-item').forEach(function (row) {
          if (row.querySelector('.astra-scoreboard')) return;
          var versus = row.querySelector('.pk-vs');
          var self = row.querySelector('.pk-self');
          var opponent = row.querySelector('.pk-opp');
          var scores = versus && versus.textContent.match(/^\((\d+(?:\.\d+)?)\) PK \((\d+(?:\.\d+)?)\)$/);
          if (!scores || !self || !opponent) return;
          var board = document.createElement('div');
          board.className = 'astra-scoreboard astra-only';
          function competitor(name, score) {
            var side = document.createElement('div');
            var label = document.createElement('span'); label.textContent = name;
            var value = document.createElement('strong'); value.textContent = score;
            side.appendChild(label); side.appendChild(value); return side;
          }
          board.appendChild(competitor(self.textContent, scores[1]));
          var vs = document.createElement('em'); vs.textContent = 'VS'; board.appendChild(vs);
          board.appendChild(competitor(opponent.textContent, scores[2]));
          Array.from(row.children).forEach(function (child) {
            if (!child.classList.contains('score-info')) child.setAttribute('data-astra-score-source', '');
          });
          row.appendChild(board);
        });
      }
      scoreboards();
      ['.container', '#dlgContainer'].forEach(function (selector) {
        var container = document.querySelector(selector);
        if (container) new MutationObserver(scoreboards).observe(container, { childList: true, subtree: true });
      });
    }
  });
  window.LernicksDesign = { set: function (value) { apply(value, true); }, get: function () { return selected; } };
})();

</script>

<script id="note-crypto">
(function(scope){
  'use strict';
  const enc = new TextEncoder(), dec = new TextDecoder('utf-8', { fatal: true });
  function encode(bytes) {
    let s = ''; for (const b of bytes) s += String.fromCharCode(b);
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function decode(s) {
    if (typeof s !== 'string' || !/^[A-Za-z0-9_-]+$/.test(s)) throw Error('INVALID_KEY');
    return Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
  }
  const random = size => encode(crypto.getRandomValues(new Uint8Array(size)));
  async function derive(secret, password, salt) {
    if (!scope.isSecureContext && typeof window !== 'undefined') throw Error('HTTPS_REQUIRED');
    if (!crypto.subtle) throw Error('HTTPS_REQUIRED');
    const master = decode(secret), saltBytes = decode(salt);
    if (master.length !== 32 || saltBytes.length !== 16) throw Error('INVALID_KEY');
    const input = new Uint8Array(32 + enc.encode(password).length);
    input.set(master); input.set(enc.encode(password), 32);
    const material = await crypto.subtle.importKey('raw', input, 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name:'PBKDF2', salt:saltBytes, iterations:600000, hash:'SHA-256' }, material, 512));
    const key = await crypto.subtle.importKey('raw', bits.slice(0,32), 'AES-GCM', false, ['encrypt','decrypt']);
    const accessKey = encode(bits.slice(32)); bits.fill(0); input.fill(0); master.fill(0);
    return { key, accessKey, salt };
  }
  async function encrypt(content, keys, slug) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const bytes = await crypto.subtle.encrypt({ name:'AES-GCM', iv, additionalData:enc.encode('note-v1:' + slug), tagLength:128 }, keys.key, enc.encode(content));
    return { v:1, kdf:'PBKDF2-SHA256', iterations:600000, salt:keys.salt, iv:encode(iv), ciphertext:encode(new Uint8Array(bytes)) };
  }
  async function decrypt(envelope, keys, slug) {
    if (envelope.v !== 1 || envelope.kdf !== 'PBKDF2-SHA256' || envelope.iterations !== 600000 || envelope.salt !== keys.salt) throw Error('INVALID_ENVELOPE');
    return dec.decode(await crypto.subtle.decrypt({ name:'AES-GCM', iv:decode(envelope.iv), additionalData:enc.encode('note-v1:' + slug), tagLength:128 }, keys.key, decode(envelope.ciphertext)));
  }
  scope.NoteCrypto = { random, derive, encrypt, decrypt };
  if (typeof module !== 'undefined') module.exports = scope.NoteCrypto;
})(globalThis);
</script>

便签'}</button></div><p id="settingsError" class="security-error" role="alert"></p><p class="settings-note">阅后即焚只保留当前打开页面的正文；无法撤回对方的截图或复制内容，也无法代删浏览器及第三方代理日志。</p></div>`}</div>`;

      if(stopped || current !== generation) return false;
      const text = area.value;
      status.textContent = '保存中…';
      const next = config || { encrypted:!!state.encrypted, burnAfterRead:!!state.burnAfterRead, hasPassword:!!state.hasPassword, question:state.question || '', password:state.password || '', secret:state.secret, keys:state.keys };
      const b = { revision:state.revision, token:state.token, create:!state.exists, burnAfterRead:next.burnAfterRead, encrypted:next.encrypted, question:next.question };

      return true;
    }
    function enqueue(fn){ const next = chain.then(fn); chain = next.catch(e => { if(current === generation) markError(e); }); return next; }
    area.oninput = () => { clearTimeout(timer); status.textContent = !state.exists || dirty ? '待保存 · 请点击保存保护设置' : '输入中…'; if(state.exists && !dirty && !stopped) timer = setTimeout(() => enqueue(() => save()).catch(()=>{}), 700); };
    panel.addEventListener('input', () => { dirty = true; clearTimeout(timer); status.textContent = '保护设置待保存'; });
    document.getElementById('lockBtn').onclick = () => panel.classList.toggle('open');
    document.getElementById('saveSettings').onclick = async () => {
      if(settingsBusy || stopped) return;
      const button = document.getElementById('saveSettings'), err = document.getElementById('settingsError'); err.textContent = '';
      const selected = mode.value, password = selected === 'none' ? '' : document.getElementById('newPw').value || (state.hasPassword ? state.password : '');
      const question = selected === 'question' ? document.getElementById('customQuestion').value.trim() : '';
      if(selected !== 'none' && !password) { err.textContent = '请设置密码或答案。'; return; }
      if(selected === 'question' && !question) { err.textContent = '请填写自定义问题。'; return; }
      const config = { encrypted:document.getElementById('e2ee').checked, burnAfterRead:document.getElementById('burnAfterRead').checked, hasPassword:selected !== 'none', question, password, secret:state.secret, keys:state.keys };
      settingsBusy = true; button.disabled = true; area.readOnly = true; clearTimeout(timer);
      for(const el of panel.querySelectorAll('input,select')) el.disabled = true;
      try { const ok = await enqueue(() => save(config)); if(ok) { dirty = false; document.getElementById('newPw').value = ''; button.textContent = '保存保护设置'; panel.classList.remove('open'); } }
      catch(_) {} finally { settingsBusy = false; if(current === generation) { button.disabled = stopped; area.readOnly = stopped; for(const el of panel.querySelectorAll('input,select')) el.disabled = false; } }
    };
    document.getElementById('copyLink').onclick = async e => {
      const button = e.currentTarget;
      if(!state.exists || dirty || settingsBusy || stopped) { status.textContent = '请先保存便签及保护设置。'; return; }
      try {
        clearTimeout(timer); await enqueue(() => save());
        if(stopped || current !== generation) return;
        const url = location.origin + location.pathname + '#/n/' + encodeURIComponent(slug) + (state.encrypted ? '?k=' + state.secret : '');
        try { await navigator.clipboard.writeText(url); button.textContent = '✓ 已复制'; } catch(_) { prompt('保存完整分享链接：', url); }
      } catch(_) {}
    };
    document.getElementById('destroyBtn').onclick = async () => {
      if(!confirm('确定销毁这份便签？此操作无法撤销。')) return;
      clearTimeout(timer);
      try { await enqueue(async () => { if(!state.exists) { stop(); scrub(); notice(root, '未保存的便签已丢弃。'); return; } const r = await api(endpoint(slug), 'DELETE', { token:state.token, revision:state.revision }); if(!r.ok) throw failure(r); stop(); forget(slug); scrub(); notice(root, '正文和访问凭据已删除。'); }); } catch(_) {}
    };
  }
  function route(){
    dispose(); dispose = () => {}; generation++;
    const current = generation, hash = location.hash || '#/';
    if(hash.startsWith('#/n/')){
      try {
        const [name, query] = hash.slice(4).split('?'), slug = decodeURIComponent(name), secret = new URLSearchParams(query || '').get('k');
        if(secret) history.replaceState(null, '', location.pathname + location.search + '#/n/' + encodeURIComponent(slug));
        open(slug, secret, current);
      } catch(_) { home(); }
    } else if(hash === '#/feedback') feedback(); else home();
  }
  function feedback(){
    app.innerHTML = nav() + `<div class="fb-wrap"><div class="fb-card"><div class="perforation"></div><h2>问题反馈</h2><p class="desc">遇到问题、有改进想法，或者只是想打个招呼？写在下面。反馈公开可见，请不要包含隐私信息。</p><label for="fbName">你的称呼（可选）</label><input type="text" id="fbName" placeholder="匿名"><label for="fbMsg">反馈内容</label><textarea id="fbMsg" placeholder="说说发生了什么…"></textarea><button class="go-btn fb-submit" id="fbSubmit">提交反馈</button><p class="fb-msg" id="fbMsgOk">已收到，感谢反馈！</p></div><div class="fb-list-wrap"><div class="fb-list-title">最近反馈</div><div id="fbList"></div></div></div>`;
    const list=document.getElementById('fbList');
    async function load(){
      try{ const r=await api('/api/feedback?limit=25'); if(!list.isConnected)return;
        list.innerHTML=r.data.items?.length?r.data.items.map(it=>`<div class="fb-item"><div class="meta"><span>${escapeHtml(it.name)}</span><span>${escapeHtml(new Date(it.createdAt).toLocaleString())}</span></div><div class="body">${escapeHtml(it.message)}</div></div>`).join(''):'<p class="fb-empty">还没有反馈，来写第一条吧</p>';
      }catch(_){if(list.isConnected)list.textContent='加载失败，请稍后重试。';}
    }
    document.getElementById('fbSubmit').onclick=async()=>{
      const name=document.getElementById('fbName').value.trim().slice(0,30),message=document.getElementById('fbMsg').value.trim();if(!message)return;
      try{const r=await api('/api/feedback','POST',{name,message});if(!r.ok)throw failure(r);if(!list.isConnected)return;document.getElementById('fbMsg').value='';document.getElementById('fbName').value='';document.getElementById('fbMsgOk').style.display='block';load();}catch(_){alert('提交失败，请稍后再试');}
    };load();
  }
  window.addEventListener('hashchange', route);
  window.addEventListener('pageshow', e => { if(e.persisted) route(); });
  route();
})();
</script>
</body>
</html>
