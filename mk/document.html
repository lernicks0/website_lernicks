<html lang="zh-CN">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.css" integrity="sha384-vlBdW0r3AcZO/HboRPznQNowvexd3fY8qHOWkBi5q7KGgqJ+F48+DceybYmrVbmB" crossorigin="anonymous">
  <style>
    :root{--bg:#070d18;--panel:#0e1c2e;--line:rgba(104,224,255,.18);--cyan:#68e0ff;--purple:#9b91ff;--green:#70efba;--gold:#ffd16f;--red:#ff788d;--text:#ecf7fc;--muted:#8fa7b8;--article:#dcebf2}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;color:var(--text);font-family:"Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 12% 0%,rgba(35,126,180,.2),transparent 33%),radial-gradient(circle at 90% 12%,rgba(94,73,198,.16),transparent 31%),var(--bg)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.3;background-image:linear-gradient(rgba(104,224,255,.023) 1px,transparent 1px),linear-gradient(90deg,rgba(104,224,255,.023) 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(#000,transparent 88%)}button,input,textarea,select{font:inherit}.page{position:relative;width:min(980px,calc(100% - 28px));margin:auto;padding:22px 0 52px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none}.logo{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;color:#06141d;font-family:Georgia,serif;font-weight:1000;background:linear-gradient(145deg,var(--cyan),#8f9cff)}.brand strong{font-size:16px}.brand span{display:block;color:var(--muted);font-size:10px;letter-spacing:.15em;margin-top:3px}.top-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.btn{padding:8px 12px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:rgba(17,43,68,.7);text-decoration:none;cursor:pointer;transition:.18s}.btn:hover{border-color:rgba(104,224,255,.5);transform:translateY(-1px)}.btn.primary{border:0;color:#04151d;font-weight:900;background:linear-gradient(135deg,var(--cyan),var(--green))}.btn.danger{color:#ffdbe1;border-color:rgba(255,120,141,.32);background:rgba(111,31,47,.34)}.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
    .loading,.error{margin:110px auto;text-align:center;color:var(--muted)}.loading i{display:block;width:35px;height:35px;margin:0 auto 15px;border:3px solid rgba(104,224,255,.16);border-top-color:var(--cyan);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error strong{display:block;color:var(--red);font-size:21px;margin-bottom:9px}
    body.reader-mode .page{width:100%;min-height:100vh;padding:0}body.reader-mode .topbar{padding:14px clamp(14px,3vw,38px);border-bottom:1px solid var(--line);background:rgba(5,16,28,.66);backdrop-filter:blur(14px)}body.reader-mode .document-head{padding:clamp(42px,8vh,88px) clamp(18px,5vw,72px) 30px}body.reader-mode .reader-tools{margin:0 clamp(12px,2.5vw,36px) 12px}body.reader-mode .article{width:100%;min-height:calc(100vh - 260px);padding:clamp(25px,5vw,72px);border-right:0;border-left:0;border-radius:0}
    .document-shell{display:none}.document-shell.show{display:block}.document-head{padding:70px 8px 28px;text-align:center}.document-head h1{font-size:clamp(31px,6vw,54px);letter-spacing:-.035em;line-height:1.13;margin:12px 0 13px;overflow-wrap:anywhere}.meta{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:12px}.chip{padding:5px 8px;border:1px solid var(--line);border-radius:99px;color:var(--cyan);background:rgba(104,224,255,.06)}.reader-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(10,26,43,.72);backdrop-filter:blur(14px)}.tabs{display:flex;gap:6px}.tab{padding:8px 12px;border:0;border-radius:9px;color:var(--muted);background:transparent;cursor:pointer}.tab.active{color:#04151d;font-weight:900;background:var(--cyan)}.reader-tools .right{display:flex;gap:7px}
    .article{min-height:450px;padding:clamp(25px,5vw,52px);border:1px solid var(--line);border-radius:19px;color:var(--article);background:linear-gradient(155deg,rgba(15,34,54,.96),rgba(8,19,32,.97));box-shadow:0 25px 75px rgba(0,0,0,.3);font-size:16px;line-height:1.85;overflow-wrap:anywhere}.article>*:first-child{margin-top:0}.article>*:last-child{margin-bottom:0}.article h1,.article h2,.article h3,.article h4{color:var(--text);line-height:1.35;margin:1.55em 0 .65em}.article h1{font-size:2em;border-bottom:1px solid var(--line);padding-bottom:.38em}.article h2{font-size:1.55em}.article h3{font-size:1.25em}.article a{color:var(--cyan);text-underline-offset:3px}.article blockquote{margin:1.2em 0;padding:.4em 1em;border-left:4px solid var(--purple);color:#b5c7d2;background:rgba(155,145,255,.065)}.article code{padding:.16em .38em;border:1px solid rgba(104,224,255,.12);border-radius:5px;color:#b8f2ff;background:#071522;font-family:Consolas,monospace;font-size:.9em}.article pre{padding:17px;border:1px solid rgba(104,224,255,.13);border-radius:12px;background:#050f1b;overflow:auto}.article pre code{padding:0;border:0;background:transparent}.article table{display:block;width:100%;border-collapse:collapse;overflow:auto;margin:1.2em 0}.article th,.article td{padding:9px 12px;border:1px solid rgba(104,224,255,.16);text-align:left}.article th{color:var(--text);background:rgba(104,224,255,.07)}.article img{display:block;max-width:100%;height:auto;margin:1.4em auto;border-radius:12px}.article hr{border:0;border-top:1px solid var(--line);margin:2em 0}.article .katex-display{overflow-x:auto;overflow-y:hidden;padding:8px 0}.source-view{margin:0;white-space:pre-wrap;word-break:break-word;font:14px/1.75 Consolas,"Microsoft YaHei",monospace;color:#d7edf5}
    .edit-shell{display:none;margin-top:55px}.edit-shell.show{display:block}.key-gate,.editor{padding:24px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(150deg,rgba(15,35,56,.95),rgba(7,18,31,.94));box-shadow:0 25px 75px rgba(0,0,0,.3)}.key-gate{width:min(450px,100%);margin:85px auto;text-align:center}.key-icon{width:64px;height:64px;margin:0 auto 16px;border-radius:19px;display:grid;place-items:center;font-size:27px;color:#06141d;background:linear-gradient(145deg,var(--cyan),var(--purple))}.key-gate h1{font-size:24px;margin:0 0 8px}.key-gate p{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 18px}.key-row{display:flex;gap:8px}.field{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:#071625;outline:none}.field:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(104,224,255,.09)}.key-error{min-height:20px;color:var(--red);font-size:12px;margin-top:9px}.editor{display:none}.editor.show{display:block}.editor-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}.editor-head h1{font-size:22px;margin:0 0 5px}.editor-head p{color:var(--muted);font-size:12px;margin:0}.label{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px;margin:13px 0 7px}.edit-grid{display:grid;grid-template-columns:1fr;gap:10px}.mixed-note{margin-top:13px;padding:10px 12px;border:1px solid rgba(104,224,255,.18);border-radius:10px;color:var(--muted);font-size:12px;line-height:1.6;background:rgba(104,224,255,.055)}.mixed-note strong{color:var(--cyan)}.editor-tabs{display:flex;gap:6px;margin:13px 0 7px}.content-field{min-height:480px;resize:vertical;padding:15px;font:14px/1.72 Consolas,"Microsoft YaHei",monospace}.content-field.hidden{display:none}.edit-preview{display:none;min-height:480px;padding:24px;border-radius:11px;box-shadow:none}.edit-preview.show{display:block}.editor-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}.counter{color:var(--muted);font-size:12px}.editor-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .toast{position:fixed;left:50%;bottom:25px;z-index:30;transform:translate(-50%,18px);padding:11px 16px;border-radius:11px;color:#05202a;font-weight:900;background:var(--cyan);opacity:0;pointer-events:none;transition:.25s;box-shadow:0 14px 45px rgba(0,0,0,.35)}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{color:#2b0710;background:var(--red)}footer{text-align:center;margin-top:28px;color:rgba(155,185,200,.4);font-size:11px}
    @media(max-width:600px){.page{width:calc(100% - 18px)}.topbar{align-items:flex-start}.brand span{display:none}.document-head{padding-top:52px}.reader-tools{align-items:flex-start;flex-direction:column}.reader-tools .right{width:100%;justify-content:flex-end}.article{padding:22px 17px;font-size:15px}.key-row{flex-direction:column}.key-row .btn{width:100%}.edit-grid{grid-template-columns:1fr}.editor{padding:16px}.content-field{min-height:400px}.editor-foot{align-items:flex-start;flex-direction:column}.editor-actions{width:100%}.editor-actions .btn{flex:1}.top-actions .label-text{display:none}}
    .format-picker{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--muted);font-size:14px}.format-picker select{width:auto}.article.html-preview,body.reader-mode .article.html-preview{padding:0;overflow:hidden}.html-frame{display:block;width:100%;height:78vh;min-height:480px;border:0;background:white;color-scheme:light}
  </style>

<body>
  <div class="page">
    <header class="topbar"><a class="brand" href="/"><div class="logo">M↓</div><div><strong>Lernicks 文档</strong><span>MARKDOWN + LATEX + HTML</span></div></a><div class="top-actions"><a class="btn" href="/">＋ <span class="label-text">新建文档</span></a><a class="btn" href="https://lernicks.cn">⌂ <span class="label-text">主站</span></a></div></header>

    <div id="loading" class="loading"><i></i>正在读取文档…</div>
    <div id="error" class="error" hidden><strong>文档无法打开</strong><span id="errorText"></span></div>

    <main id="documentShell" class="document-shell">
      <section class="document-head"><span id="formatChip" class="chip">Markdown</span><h1 id="documentTitle"></h1><div class="meta"><span id="documentTime"></span><span>·</span><span id="documentSize"></span></div></section>
      <div class="reader-tools"><div class="tabs"><button id="renderTab" class="tab active" type="button">渲染效果</button><button id="sourceTab" class="tab" type="button">查看源码</button></div><div class="right"><button id="copyButton" class="btn" type="button">复制链接</button><a id="rawButton" class="btn" target="_blank" rel="noopener">查看原文</a></div></div>
      <article id="article" class="article"></article>
    </main>

    <main id="editShell" class="edit-shell">
      <section id="keyGate" class="key-gate"><div class="key-icon">⌘</div><h1>编辑这份文档</h1><p>输入创建文档时得到的密钥。密钥正确后才能修改或删除。</p><div class="key-row"><input id="keyInput" class="field" type="password" autocomplete="current-password" placeholder="输入文档密钥"><button id="verifyButton" class="btn primary" type="button">验证密钥</button></div><div id="keyError" class="key-error"></div></section>
      <section id="editor" class="editor"><div class="editor-head"><div><h1>编辑文档</h1><p id="editorId"></p></div><a id="viewButton" class="btn" target="_blank" rel="noopener">打开阅读页</a></div><div class="edit-grid"><div><label class="label" for="editTitle"><span>标题</span></label><input id="editTitle" class="field" maxlength="120"></div></div><div id="mixedNote" class="mixed-note"><strong>Markdown + LaTeX + HTML 混合模式</strong>：可直接插入 HTML 标签；行内公式用 $...$，独立公式用 $...$。</div><div class="editor-tabs"><button id="writeTab" class="tab active" type="button">编辑</button><button id="previewTab" class="tab" type="button">实时预览</button></div><label class="label" for="editContent"><span>正文</span><span id="editCounter" class="counter">0 B / 1 MB</span></label><textarea id="editContent" class="field content-field" spellcheck="false"></textarea><article id="editPreview" class="article edit-preview"></article><div class="editor-foot"><span>保存后阅读链接不会改变。</span><div class="editor-actions"><button id="deleteButton" class="btn danger" type="button">删除文档</button><button id="saveButton" class="btn primary" type="button">保存修改</button></div></div></section>
    </main>

    <footer>mk.lernicks.cn · 公开文档分享</footer>
  </div>
  <div id="toast" class="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/katex.min.js" integrity="sha384-AtrdNsnxl/75rvBneBVH7DtOvCxSVahR2zWqle1coBKd8DEmLoviqNeJSx64gNAs" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.17.0/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>
  <script src="/purify.min.js"></script>
  <script src="/html-support.js"></script>
  <script>
    const MAX_BYTES=1024*1024;
    const pathMatch=location.pathname.match(/^\/d\/([a-f0-9]{16})(\/pre)?\/?$/);
    const documentId=pathMatch?pathMatch[1]:'';
    const editMode=!!(pathMatch&&pathMatch[2]);
    document.body.classList.add(editMode?'edit-mode':'reader-mode');
    let documentData=null,documentKey='',currentEditFormat='mixed',editPreviewTimer=null;
    const article=document.getElementById('article');
    function updateEditFormat(){const note=document.getElementById('mixedNote');note.textContent=currentEditFormat==='html'?'HTML 网页模式：支持完整页面与 HTML 片段，可切换到实时预览。':currentEditFormat==='latex'?'旧版 LaTeX 兼容模式：这份文档仍按原方式渲染。':'Markdown + LaTeX + HTML 混合模式：可直接插入 HTML 标签；行内公式用 $...$，独立公式用 $...$。';if(document.getElementById('editPreview').classList.contains('show'))renderEditPreview()}
    function formatBytes(bytes){if(bytes<1024)return bytes+' B';if(bytes<1024*1024)return(bytes/1024).toFixed(1)+' KB';return(bytes/1024/1024).toFixed(2)+' MB'}
    function byteLength(value){return new TextEncoder().encode(value).length}
    function toast(message,bad=false){const el=document.getElementById('toast');el.textContent=message;el.className='toast show'+(bad?' bad':'');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.className='toast',2300)}
    function escapeHtml(value){return String(value).replace(/[&<>"']/g,character=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]))}
    function showError(message){document.getElementById('loading').hidden=true;document.getElementById('error').hidden=false;document.getElementById('errorText').textContent=message}
    async function loadDocument(){if(!documentId){showError('链接格式不正确');return}try{const response=await fetch('/api/documents/'+documentId,{cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.message||'文档不存在');documentData=data.document;document.title=documentData.title+' · Lernicks 文档';document.getElementById('loading').hidden=true;if(editMode)showEditGate();else showReader()}catch(error){showError(error.message)}}
    function showReader(){document.getElementById('documentShell').classList.add('show');document.getElementById('documentTitle').textContent=documentData.title;document.getElementById('formatChip').textContent=documentData.format==='html'?'HTML 网页':documentData.format==='latex'?'旧版 LaTeX':'Markdown + LaTeX + HTML';document.getElementById('documentTime').textContent='更新于 '+new Date(documentData.updatedAt).toLocaleString('zh-CN');document.getElementById('documentSize').textContent=formatBytes(documentData.size);document.getElementById('rawButton').href='/raw/'+documentId;renderDocument();document.getElementById('renderTab').onclick=renderDocument;document.getElementById('sourceTab').onclick=showSource;document.getElementById('copyButton').onclick=()=>copyText(location.href)}
    function renderDocument(){document.getElementById('renderTab').classList.add('active');document.getElementById('sourceTab').classList.remove('active');renderInto(article,documentData.content,documentData.format)}
    function renderInto(target,content,format){target.classList.remove('html-preview');if(format==='html'){MkHtml.renderHtml(target,content);return}if(format==='latex')target.innerHTML=renderLatexText(content);else renderMarkdown(content,target);renderMath(target)}
    function renderMarkdown(content,target=article){if(typeof window.markdownit!=='function'){showSafePre(content,target);return}const mathBlocks=[];const protectedContent=String(content).replace(/\$\$([\s\S]*?)\$\$/g,(_,formula)=>'\n\nMKDOCMATHBLOCK'+(mathBlocks.push(formula)-1)+'END\n\n');const md=window.markdownit({html:true,breaks:true,linkify:true,typographer:true});const originalLink=md.renderer.rules.link_open||function(tokens,index,options,env,self){return self.renderToken(tokens,index,options)};md.renderer.rules.link_open=function(tokens,index,options,env,self){tokens[index].attrSet('target','_blank');tokens[index].attrSet('rel','noopener noreferrer');return originalLink(tokens,index,options,env,self)};const rendered=md.render(protectedContent).replace(/<p>MKDOCMATHBLOCK(\d+)END<\/p>/g,(_,index)=>'<div class="math-block">$$'+escapeHtml(mathBlocks[Number(index)]||'')+'$$</div>');if(!MkHtml.insertMarkdownHtml(target,rendered))showSafePre(content,target)}
    function renderLatexText(source){let text=String(source).replace(/^\s*\\(?:documentclass|usepackage|title|author|date)(?:\[[^\]]*\])?\{.*\}\s*$/gm,'').replace(/\\begin\{document\}|\\end\{document\}|\\maketitle/g,'');text=escapeHtml(text);text=text.replace(/\\begin\{verbatim\}([\s\S]*?)\\end\{verbatim\}/g,(_,body)=>'\n\n<pre><code>'+body.trim()+'</code></pre>\n\n');text=text.replace(/\\begin\{itemize\}([\s\S]*?)\\end\{itemize\}/g,(_,body)=>'\n\n<ul>'+body.split(/\\item\s+/).slice(1).map(item=>'<li>'+item.trim()+'</li>').join('')+'</ul>\n\n');text=text.replace(/\\begin\{enumerate\}([\s\S]*?)\\end\{enumerate\}/g,(_,body)=>'\n\n<ol>'+body.split(/\\item\s+/).slice(1).map(item=>'<li>'+item.trim()+'</li>').join('')+'</ol>\n\n');text=text.replace(/\\begin\{quote\}([\s\S]*?)\\end\{quote\}/g,(_,body)=>'\n\n<blockquote>'+body.trim()+'</blockquote>\n\n');text=text.replace(/\\section\*?\{([^{}]*)\}/g,'\n\n<h1>$1</h1>\n\n').replace(/\\subsection\*?\{([^{}]*)\}/g,'\n\n<h2>$1</h2>\n\n').replace(/\\subsubsection\*?\{([^{}]*)\}/g,'\n\n<h3>$1</h3>\n\n');text=text.replace(/\\textbf\{([^{}]*)\}/g,'<strong>$1</strong>').replace(/\\(?:textit|emph)\{([^{}]*)\}/g,'<em>$1</em>').replace(/\\underline\{([^{}]*)\}/g,'<u>$1</u>');return text.split(/\n{2,}/).map(block=>{const clean=block.trim();if(!clean)return'';if(/^<(?:h[1-6]|ul|ol|pre|blockquote)/.test(clean))return clean;return'<p>'+clean.replace(/\\\\\s*(?:\n|$)/g,'<br>').replace(/\n/g,'<br>')+'</p>'}).join('')}
    function renderMath(target=article){if(typeof window.renderMathInElement!=='function')return;try{window.renderMathInElement(target,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true},{left:'\\begin{equation}',right:'\\end{equation}',display:true},{left:'\\begin{align}',right:'\\end{align}',display:true},{left:'\\begin{gather}',right:'\\end{gather}',display:true}],throwOnError:false,strict:'warn',trust:false})}catch(error){console.warn('公式渲染失败',error)}}
    function showSafePre(content,target=article){target.innerHTML='';const pre=document.createElement('pre'),code=document.createElement('code');code.textContent=content;pre.appendChild(code);target.appendChild(pre)}
    function showSource(){article.classList.remove('html-preview');document.getElementById('sourceTab').classList.add('active');document.getElementById('renderTab').classList.remove('active');article.innerHTML='';const pre=document.createElement('pre');pre.className='source-view';pre.textContent=documentData.content;article.appendChild(pre)}
    function showEditGate(){document.getElementById('editShell').classList.add('show');document.getElementById('verifyButton').onclick=verifyKey;document.getElementById('keyInput').addEventListener('keydown',event=>{if(event.key==='Enter')verifyKey()});setTimeout(()=>document.getElementById('keyInput').focus(),80)}
    async function verifyKey(){const input=document.getElementById('keyInput'),key=input.value.trim(),button=document.getElementById('verifyButton'),error=document.getElementById('keyError');if(!key){error.textContent='请先输入文档密钥';return}button.disabled=true;error.textContent='';try{const response=await fetch('/api/documents/'+documentId+'/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});const data=await response.json();if(!response.ok)throw new Error(data.message||'验证失败');documentKey=key;openEditor()}catch(problem){error.textContent=problem.message;input.select()}finally{button.disabled=false}}
    function openEditor(){document.getElementById('keyGate').style.display='none';document.getElementById('editor').classList.add('show');currentEditFormat=MkHtml.resolveFormat(documentData.format,documentData.content);updateEditFormat();document.getElementById('editTitle').value=documentData.title;document.getElementById('editContent').value=documentData.content;document.getElementById('editorId').textContent='文档编号：'+documentId;document.getElementById('viewButton').href='/d/'+documentId;if(currentEditFormat==='latex')document.getElementById('mixedNote').innerHTML='<strong>旧版 LaTeX 兼容模式</strong>：这份旧文档仍按原方式渲染。';document.getElementById('editContent').addEventListener('input',updateEditCounter);document.getElementById('writeTab').onclick=showWriteEditor;document.getElementById('previewTab').onclick=showEditPreview;document.getElementById('saveButton').onclick=saveChanges;document.getElementById('deleteButton').onclick=deleteCurrent;showWriteEditor();updateEditCounter()}
    function showWriteEditor(){clearTimeout(editPreviewTimer);document.getElementById('editPreview').replaceChildren();document.getElementById('writeTab').classList.add('active');document.getElementById('previewTab').classList.remove('active');document.getElementById('editContent').classList.remove('hidden');document.getElementById('editPreview').classList.remove('show')}
    function showEditPreview(){document.getElementById('previewTab').classList.add('active');document.getElementById('writeTab').classList.remove('active');document.getElementById('editContent').classList.add('hidden');document.getElementById('editPreview').classList.add('show');renderEditPreview()}
    function renderEditPreview(){renderInto(document.getElementById('editPreview'),document.getElementById('editContent').value,currentEditFormat)}
    function updateEditCounter(){const content=document.getElementById('editContent').value,size=byteLength(content),counter=document.getElementById('editCounter');counter.textContent=formatBytes(size)+' / 1 MB';counter.style.color=size>MAX_BYTES?'var(--red)':'';if(document.getElementById('editPreview').classList.contains('show')){clearTimeout(editPreviewTimer);editPreviewTimer=setTimeout(renderEditPreview,120)}}
    async function saveChanges(){const button=document.getElementById('saveButton'),content=document.getElementById('editContent').value;if(!content.trim()){toast('正文不能为空',true);return}if(byteLength(content)>MAX_BYTES){toast('文档不能超过 1MB',true);return}button.disabled=true;button.textContent='正在保存…';try{const response=await fetch('/api/documents/'+documentId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:documentKey,title:document.getElementById('editTitle').value,format:currentEditFormat,content})});const data=await response.json();if(!response.ok)throw new Error(data.message||'保存失败');documentData.title=document.getElementById('editTitle').value||'未命名文档';documentData.format=currentEditFormat;documentData.content=content;documentData.updatedAt=data.updatedAt;toast('修改已保存')}catch(error){toast(error.message,true)}finally{button.disabled=false;button.textContent='保存修改'}}
    async function deleteCurrent(){if(!confirm('确定永久删除这份文档吗？删除后阅读链接会立即失效。'))return;const button=document.getElementById('deleteButton');button.disabled=true;try{const response=await fetch('/api/documents/'+documentId,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:documentKey})});const data=await response.json();if(!response.ok)throw new Error(data.message||'删除失败');alert('文档已删除');location.replace('/')}catch(error){toast(error.message,true);button.disabled=false}}
    async function copyText(value){try{await navigator.clipboard.writeText(value)}catch(_){const area=document.createElement('textarea');area.value=value;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();document.execCommand('copy');area.remove()}toast('链接已复制')}
    loadDocument();
  </script>
</body>
</html>
